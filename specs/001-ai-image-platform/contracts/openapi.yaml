openapi: 3.1.0
info:
  title: AI 图像生成平台 API
  version: 1.2.0
  description: |
    v1 公开 REST 契约。AI 路由由 gateway-service 实现，其余由 platform-api 实现。
    v1.2（2026-06-04）：退款 API、公开展示 sort；v1.1 双渠道与账单。
servers:
  - url: https://api.example.com
    description: 生产
  - url: http://localhost:8080
    description: platform-api
  - url: http://localhost:8081
    description: gateway-service

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string }
        data: {}
        timestamp: { type: integer, format: int64 }
    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account: { type: string, description: 手机号或邮箱 }
        password: { type: string, minLength: 8, maxLength: 20 }
        rememberMe: { type: boolean, default: false }
    RegisterRequest:
      type: object
      required: [password, nickname, verifyCode]
      properties:
        phone: { type: string }
        email: { type: string, format: email }
        password: { type: string }
        nickname: { type: string }
        verifyCode: { type: string }
        inviteCode: { type: string, maxLength: 10 }
    TokenData:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
    ImageGenerateRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1 }
        size: { type: string, enum: ['1024x1024', '1792x1024', '1024x1792'], default: '1024x1024' }
        n: { type: integer, minimum: 1, maximum: 1, default: 1 }
        sessionId: { type: string, format: uuid }
    ImageGenerateResponse:
      type: object
      properties:
        taskId: { type: string }
        imageUrl: { type: string, format: uri }
        remainingQuota: { type: integer }
    ChatRequest:
      type: object
      required: [messages, sessionId]
      properties:
        sessionId: { type: string, format: uuid }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant, system] }
              content: { type: string }
    CreateOrderRequest:
      type: object
      required: [packageId]
      properties:
        packageId: { type: integer }
        payChannel:
          type: string
          enum: [WECHAT, ALIPAY]
          default: WECHAT
          description: 支付渠道
    CreateOrderResponse:
      type: object
      properties:
        orderNo: { type: string }
        payType: { type: string, enum: [WECHAT, ALIPAY] }
        codeUrl: { type: string, description: 微信 Native 或支付宝扫码链接 }
        expiresAt: { type: string, format: date-time }
        amount: { type: number }
        quotaGranted: { type: integer }
    PayOrderView:
      type: object
      properties:
        orderNo: { type: string }
        payType: { type: string, enum: [WECHAT, ALIPAY] }
        status: { type: string, enum: [PENDING, PAID, CANCELLED, REFUNDED] }
        amount: { type: number }
        quotaGranted: { type: integer }
        codeUrl: { type: string }
        expiresAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
    PublicGalleryItem:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [TEMPLATE] }
        templateId: { type: integer }
        title: { type: string }
        imageUrl: { type: string, format: uri }
        useCount: { type: integer }
    AdminBillingOrderView:
      type: object
      properties:
        orderNo: { type: string }
        userId: { type: integer }
        packageId: { type: integer }
        amount: { type: number }
        quotaGranted: { type: integer }
        payType: { type: string, enum: [WECHAT, ALIPAY] }
        status: { type: string }
        channelTradeNo: { type: string }
        paidAt: { type: string, format: date-time }
        refundedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    BillingSummary:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        paidCount: { type: integer }
        totalAmount: { type: number }
        byPayType:
          type: array
          items:
            type: object
            properties:
              payType: { type: string, enum: [WECHAT, ALIPAY] }
              count: { type: integer }
              amount: { type: number }

paths:
  /api/v1/auth/send-sms:
    post:
      tags: [Auth]
      summary: 发送手机验证码
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, pattern: '^1[3-9]\d{9}$' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 用户注册
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200': { description: OK }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 登录
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenData' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新 Token
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/v1/ai/chat:
    post:
      tags: [AI-Gateway]
      summary: 文字对话（SSE）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  /api/v1/ai/image/generate:
    post:
      tags: [AI-Gateway]
      summary: 生成图片（先扣后调）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageGenerateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ImageGenerateResponse' }
        '402': { description: 次数不足 }
        '409': { description: 已有进行中的生图任务 }

  /api/v1/ai/sessions:
    get:
      tags: [AI]
      summary: 会话列表
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/v1/ai/sessions/{id}/messages:
    get:
      tags: [AI]
      summary: 会话消息（分页）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: OK }

  /api/v1/user/quota:
    get:
      tags: [User]
      summary: 剩余次数
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/v1/user/images:
    get:
      tags: [User]
      summary: 个人图库
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200': { description: OK }

  /api/v1/user/invite:
    get:
      tags: [User]
      summary: 邀请码与链接
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/v1/templates:
    get:
      tags: [Template]
      summary: 模版广场（仅 APPROVED；游客可访问）
      parameters:
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: keyword
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [hot, latest] }
      responses:
        '200': { description: OK }

  /api/v1/templates/publish:
    post:
      tags: [Template]
      summary: 发布模版
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/v1/templates/{id}/use:
    post:
      tags: [Template]
      summary: 使用模版
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /api/v1/pay/packages:
    get:
      tags: [Pay]
      summary: 充值套餐列表
      responses:
        '200': { description: OK }

  /api/v1/gallery/public:
    get:
      tags: [Gallery]
      summary: 公开展示图库（游客可访问）
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 48 }
        - name: sort
          in: query
          schema: { type: string, enum: [hot, latest], default: hot }
          description: hot=按使用次数；latest=按创建时间
      responses:
        '200':
          description: 分页展示项（仅已上架模版封面，自动排序）
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PublicGalleryItem' }
                          total: { type: integer }
                          page: { type: integer }
                          size: { type: integer }

  /api/v1/pay/create-order:
    post:
      tags: [Pay]
      summary: 创建充值订单（微信 Native 或支付宝扫码）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CreateOrderResponse' }
        '400': { description: 套餐无效或支付渠道不支持 }

  /api/v1/pay/wx-notify:
    post:
      tags: [Pay]
      summary: 微信支付回调（无 JWT）
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notifyId: { type: string }
                orderNo: { type: string }
                transactionId: { type: string }
      responses:
        '200': { description: 微信要求的成功应答 }

  /api/v1/pay/alipay-notify:
    post:
      tags: [Pay]
      summary: 支付宝异步通知（无 JWT）
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notifyId: { type: string }
                orderNo: { type: string }
                transactionId: { type: string }
      responses:
        '200': { description: success }

  /api/v1/pay/orders:
    get:
      tags: [Pay]
      summary: 当前用户充值订单列表
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PayOrderView' }
                          total: { type: integer }
                          page: { type: integer }
                          size: { type: integer }

  /api/v1/pay/order/{orderNo}:
    get:
      tags: [Pay]
      summary: 查询订单
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /api/v1/admin/templates/pending:
    get:
      tags: [Admin]
      summary: 待审核模版
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/v1/admin/templates/{id}/audit:
    post:
      tags: [Admin]
      summary: 审核模版
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string }
      responses:
        '200': { description: OK }

  /api/v1/admin/billing/orders:
    get:
      tags: [Admin, Billing]
      summary: 管理员 — 充值订单查询（可按用户筛选）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, PAID, CANCELLED, REFUNDED] }
        - name: payType
          in: query
          schema: { type: string, enum: [WECHAT, ALIPAY] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AdminBillingOrderView' }
                          total: { type: integer }
                          page: { type: integer }
                          size: { type: integer }
        '403': { description: 非管理员 }

  /api/v1/admin/billing/orders/{orderNo}/refund:
    post:
      tags: [Admin, Billing]
      summary: 管理员 — 对已支付订单发起原路退款
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 退款成功，订单 REFUNDED，次数已扣回
        '400':
          description: 余额不足扣回、非 PAID 状态或渠道退款失败
        '403': { description: 非管理员 }
        '404': { description: 订单不存在 }

  /api/v1/admin/billing/summary:
    get:
      tags: [Admin, Billing]
      summary: 管理员 — 系统账单汇总
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 成功笔数、总金额、按 payType 分布
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BillingSummary' }
        '403': { description: 非管理员 }

  /internal/quota/reserve:
    post:
      tags: [Internal]
      summary: 预扣 1 次（gateway 调用）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer }
                reservationId: { type: string }
      responses:
        '200': { description: OK }
        '402': { description: 余额不足 }
        '409': { description: in-flight }

  /internal/quota/commit:
    post:
      tags: [Internal]
      summary: 确认扣减
      responses:
        '200': { description: OK }

  /internal/quota/rollback:
    post:
      tags: [Internal]
      summary: 回滚预扣
      responses:
        '200': { description: OK }
