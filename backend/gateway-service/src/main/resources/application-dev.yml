spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      chat:
        options:
          model: gpt-4o-mini

app:
  image:
    api-url: ${IMAGE_API_URL:https://dm-fox.rjj.cc/codex/v1/images/generations}
    api-key: ${OPENAI_API_KEY:${IMAGE_API_KEY:sk-placeholder}}
    model: ${IMAGE_MODEL:gpt-image-2}
    quality: ${IMAGE_QUALITY:medium}
  minio:
    endpoint: http://localhost:9000
    public-endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: ai-images

logging:
  level:
    com.ts.gateway: DEBUG
