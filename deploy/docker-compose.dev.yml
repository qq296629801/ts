# 开发一键启动：docker compose -f deploy/docker-compose.dev.yml up -d --build
# 访问 http://localhost
# 国内拉镜像失败：见 deploy/.env.example 与 deploy/README.md

services:
  mysql:
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.0}
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_platform
      MYSQL_USER: ai
      MYSQL_PASSWORD: ai123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-docker.m.daocloud.io/minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: ${MINIO_MC_IMAGE:-docker.m.daocloud.io/minio/mc:latest}
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do sleep 2; done;
      mc mb local/ai-images --ignore-existing;
      mc anonymous set download local/ai-images;
      echo 'MinIO bucket ai-images 已就绪';
      "

  platform-api:
    build:
      context: ..
      dockerfile: deploy/docker/platform-api.Dockerfile.dev
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-docker.m.daocloud.io/library/maven:3.9-eclipse-temurin-17}
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev,docker
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-at-least-32-chars-long!!}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  gateway-service:
    build:
      context: ..
      dockerfile: deploy/docker/gateway-service.Dockerfile.dev
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-docker.m.daocloud.io/library/maven:3.9-eclipse-temurin-17}
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev,docker
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-at-least-32-chars-long!!}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      IMAGE_API_URL: ${IMAGE_API_URL:-https://dm-fox.rjj.cc/codex/v1/images/generations}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      IMAGE_QUALITY: ${IMAGE_QUALITY:-medium}
    depends_on:
      - platform-api
      - minio-init
    restart: on-failure

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:18-alpine}
    ports:
      - "8082:8082"
    environment:
      VUE_APP_PROXY_PLATFORM: http://platform-api:8080
      VUE_APP_PROXY_GATEWAY: http://gateway-service:8081
    depends_on:
      - platform-api
      - gateway-service

  nginx:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      platform-api:
        condition: service_started
      gateway-service:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  mysql_data:
  minio_data:
