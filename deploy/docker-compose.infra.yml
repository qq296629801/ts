# 仅中间件（应用在宿主机 mvn/npm 启动，避免构建 maven/node 镜像）
# docker compose -f deploy/docker-compose.infra.yml up -d

services:
  mysql:
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.0}
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_platform
      MYSQL_USER: ai
      MYSQL_PASSWORD: ai123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    ports:
      - "6379:6379"

  minio:
    image: ${MINIO_IMAGE:-docker.m.daocloud.io/minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: ${MINIO_MC_IMAGE:-docker.m.daocloud.io/minio/mc:latest}
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do sleep 2; done;
      mc mb local/ai-images --ignore-existing;
      mc anonymous set download local/ai-images;
      "

volumes:
  mysql_data:
  minio_data:
